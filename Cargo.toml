[workspace]
members = [
    "server",
    "apps/desktop/src-tauri",
    "crates/semble-core",
    "apps/semantic-mcp",
    "support/benchmarks/semble",
]
resolver = "2"

# Keep local Rust builds compact. Full dependency debug info and incremental
# object caches dominate target/ in this workspace, while line tables for our
# own crates are enough for normal backtraces and source-level debugging.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0

# byok-semantic ships inside the workspace-symbols VSIX, so its release build
# trades build time for binary size. Only the release workflow uses it, so the
# desktop app's release profile is untouched.
[profile.vsix]
inherits = "release"
strip = true
lto = true
codegen-units = 1
opt-level = "z"
