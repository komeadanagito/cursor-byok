[package]
name = "byok-semantic"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rmcp = { version = "3", default-features = false, features = [
    "macros",
    "server",
    "transport-io",
] }
schemars = "1"
semble-core = { path = "../../crates/semble-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }
