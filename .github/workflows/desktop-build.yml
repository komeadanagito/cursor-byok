name: Desktop build (manual)

# Produces installable packages on demand, without touching releases.
# `ci.yml` only compiles and checks; this workflow is how a maintainer gets a
# runnable artifact before any tag exists.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            args: "--bundles nsis"
            target: ""
            artifact: cursor-byok-windows-x86_64
            path: target/release/bundle/nsis/*.exe
          - platform: macos-aarch64
            os: macos-15
            args: "--bundles dmg --target aarch64-apple-darwin"
            target: aarch64-apple-darwin
            artifact: cursor-byok-macos-aarch64
            path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-x86_64
            os: macos-15-intel
            args: "--bundles dmg --target x86_64-apple-darwin"
            target: x86_64-apple-darwin
            artifact: cursor-byok-macos-x86_64
            path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: linux-x86_64
            os: ubuntu-22.04
            args: "--bundles appimage,deb"
            target: ""
            artifact: cursor-byok-linux-x86_64
            path: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.platform }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # The updater artifacts need TAURI_SIGNING_PRIVATE_KEY, which this
      # workflow deliberately does not hold: it produces local installers,
      # not a release. Turn them off rather than fail after the long build.
      - name: Build bundle
        working-directory: apps/desktop
        run: npm run tauri:build -- ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
